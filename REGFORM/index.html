<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REG FORM</title>
    <link rel="stylesheet" href="REGFORM.css">
</head>
<body style="background-color: aqua;">
    <Table>
        <tr>
        <th>STUDENT REGISTRATION FORM</th>
        </tr>
        <tr>
            <td>Name:</td>
            <td><input type="text" placeholder="ENTER FULL NAME" size="20"></td>
        </tr>
        <tr>
            <td>Father's name:</td>
            <td><input type="text" size="20"></td>
        </tr>
        <tr>
           <td> Mother's name:</td>
           <td><input type="text" size="20"></td>
        </tr>
        <tr>
         <td>Phone number:</td>
         <td><input type="text" placeholder="017xxxxxxxxx"></td>
        </tr>
        <tr>
         <td>Email:</td>
          <td><input type="text" placeholder="sample@example.com"></td>
        </tr>
        <tr>
            <td>Gender:</td>
            <td>
            <input type="radio">Male
            <input type="radio">Female
            <input type="radio">Other
            </td>
        </tr>
        <tr>
            <td>Date of birth:</td>
            <td ><input type="date""></td>
        </tr>
        <tr>
       <td>Address:</td>
       <td><input type="text" placeholder="Street:-   House:-    Road:-    "></td>
        </tr>
        <tr>
            <td>Blood group:</td>
            <td>
            <select name="" id="">
            <option value="">A</option>
            <option value="">B</option>
            <option value="">AB</option>
            <option value="">O</option>
            </select>
        </td>
        </tr>
        <tr>
        <td>Department:</td>
        <td>
        <input type="Radio">CSE
        <input type="Radio">EEE
        <input type="Radio">BBA
        </td>
        </tr>
        <tr>
        <td>Course:</td>
        <td>
        <input type="checkbox">C 
        <input type="checkbox">EEE
        <input type="checkbox">Java
        <input type="checkbox">Machine Learning
        <input type="checkbox">Robotics
        </td>
        </tr>
        <tr>
            <td>Photo:</td>
            <td><input type="file"></td>
        </tr>
        <tr>
        <td><input type="submit" value="submit"> <input type="reset">
        </tr>
    </Table>
    
</body>
</html>
